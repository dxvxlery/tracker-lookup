name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm run check
      - name: Committed build is up to date
        run: git diff --exit-code -- dist README.md README.ru.md CHANGELOG.md
      - run: npm run notes
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "TrackerLookup $GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/TrackerLookup.plugin.js --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/TrackerLookup.plugin.js --title "TrackerLookup $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
